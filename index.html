<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Симулятор деревни радужных драконов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canopy:#0b3d2e; --leaf:#1f7a4d; --sun-gold:#f7b32b; --papaia:#ff8f5e;
    --scale-pink:#e85da0; --sky:#9fe3e0; --cream:#fdf6e3; --ink:#123324;
  }
  *{box-sizing:border-box; margin:0;}
  body{
    font-family:'Nunito',sans-serif; color:var(--ink);
    background:linear-gradient(180deg,#9fe3e0 0%,#bfeed1 45%,#f9e8b8 100%);
    min-height:100vh;
  }
  header{ text-align:center; padding:14px 10px 4px;}
  h1{
    font-family:'Fredoka',sans-serif; font-size:1.5rem; color:var(--canopy);
    letter-spacing:.5px;
  }
  .slogan{font-size:.85rem; opacity:.75;}
  main{max-width:520px; margin:0 auto; padding:8px 12px 40px;}
  .stats{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:8px 0;
  }
  .stat{
    background:var(--cream); border:2px solid var(--canopy); border-radius:14px;
    padding:6px 12px; text-align:center; min-width:88px;
  }
  .stat b{font-family:'Fredoka',sans-serif; font-size:1.05rem; display:block; color:var(--canopy);}
  .stat span{font-size:.72rem; opacity:.7;}
  .stage{
    position:relative; border-radius:20px; overflow:hidden; border:3px solid var(--canopy);
    background:linear-gradient(180deg,#8fdcd8,#bfeed1 55%,#ffe9a8); height:280px;
  }
  .canopyBand{position:absolute; top:0; left:0; right:0; height:60px;
    background: repeating-linear-gradient(90deg, rgba(27,90,60,.9) 0 34px, rgba(31,122,77,.85) 34px 62px, rgba(15,70,45,.9) 62px 92px);
    border-radius:0 0 40% 40% / 0 0 18px 18px;}
  .village{position:absolute; bottom:38px; left:0; right:0; display:flex; justify-content:center; gap:6px; flex-wrap:wrap; padding:0 8px;}
  .hut{
    width:52px; height:44px; border-radius:14px 14px 6px 6px; position:relative;
    background:#c97b4b; border:2px solid var(--canopy);
    animation:pop .35s ease-out;
  }
  .hut::before{content:''; position:absolute; top:-16px; left:8px; border-left:16px solid transparent;
    border-right:16px solid transparent; border-bottom:18px solid var(--leaf);}
  .hutsleep::after{content:'💤'; position:absolute; top:-10px; right:-8px; font-size:14px;}
  @keyframes pop{from{transform:scale(.3); opacity:0;} to{transform:scale(1); opacity:1;}}
  .ground{position:absolute; bottom:0; left:0; right:0; height:38px;
    background:repeating-linear-gradient(90deg,#3f9a5a 0 22px,#2f7f4a 22px 44px);}
  .fruitTree{position:absolute; background:#2c6e46; border-radius:45% 45% 20% 20%; width:70px; height:56px; top:110px;}
  .fruitTree::before{position:absolute; bottom:-26px; left:9px;
    width:12px; height:28px; background:#5d4037; border-radius:4px; box-shadow:-18px 0 0 #5d4037;}
  .fruitDot{position:absolute; width:12px; height:12px; border-radius:50%; background:var(--papaia);
    cursor:pointer; transition:transform .15s; z-index:5;}
  .fruitDot:hover{transform:scale(1.35); background:var(--sun-gold);}
  .suncatcher{position:absolute; top:6px; right:10px; z-index:6; animation:pop .3s;}
  .bigDragon{
    position:absolute; bottom:52px; font-size:56px; cursor:pointer; user-select:none;
    transition:opacity .3s; animation:pop .3s;
  }
  .rainbowWing{position:absolute; bottom:66px; font-size:40px;
    animation:flyLoop 9s linear infinite; opacity:.9; pointer-events:none;}
  @keyframes flyLoop{from{left:-60px;} to{left:105%;}}
  .panel{background:var(--cream); border:2px solid var(--canopy); border-radius:16px; padding:12px; margin-top:10px;}
  .panel h2{font-family:'Fredoka',sans-serif; font-size:1rem; color:var(--canopy); margin-bottom:8px;}
  button{
    font-family:'Nunito',sans-serif; font-weight:700; font-size:.9rem;
    background:var(--leaf); color:#fff; border:none; border-radius:12px;
    padding:9px 14px; margin:3px; cursor:pointer;
  }
  button:disabled{background:#9db8a6; opacity:.7;}
  button.alt{background:var(--papaia);}
  button.sun{background:var(--sun-gold); color:var(--ink);}
  button.danger{background:#c94f3d;}
  ul.log{list-style:none; font-size:.8rem; max-height:110px; overflow:auto; padding:0; margin-top:6px;}
  ul.log li{padding:2px 0; border-bottom:1px dashed rgba(18,51,36,.2);}
  .daybar{height:14px; border-radius:8px; margin-top:6px; border:2px solid var(--canopy);
    background:linear-gradient(90deg,#0b3d2e 0,#1f7a4d 40%,#f7b32b 70%,#9fe3e0 90%);}
  .daybar .marker{height:100%; width:4px; background:#fff; border-radius:2px; transition:margin-left 1s linear;}
  .saveship{font-size:.75rem; opacity:.65; text-align:center; margin-top:6px;}
  .toast{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    background:var(--canopy); color:#fff; padding:8px 16px; border-radius:20px;
    font-size:.85rem; opacity:0; transition:opacity .3s; pointer-events:none; z-index:20;
  }
  .toast.show{opacity:1;}
  @media (prefers-reduced-motion: reduce){
    .rainbowWing{animation:none; right:20px; left:auto;}
    .hut, .bigDragon{animation:none;}
  }
</style>
</head>
<body>
<header>
  <h1>🐉 Симулятор деревни радужных драконов 🌴</h1>
  <p class="slogan">Мирная долина. Фрукты. Сиеста.</p>
</header>
<main>
  <div class="stats">
    <div class="stat"><b id="fruit">5</b><span>🥭 Фрукты</span></div>
    <div class="stat"><b id="shells">0</b><span>🐚 Краски</span></div>
    <div class="stat"><b id="morale">50%</b><span>😊 Настроение</span></div>
    <div class="stat"><b id="pop">1</b><span>🐲 Дракончики</span></div>
  </div>

  <div class="stage" id="stage">
    <div class="canopyBand"></div>
    <div class="fruitTree" style="left:8%; top:120px;"><div class="fruitDot" style="top:8px;left:6px"></div><div class="fruitDot" style="top:30px;left:34px"></div><div class="fruitDot" style="top:14px;left:48px"></div></div>
    <div class="fruitTree" style="right:8%; top:135px;"><div class="fruitDot" style="top:10px;left:8px"></div><div class="fruitDot" style="top:28px;left:36px"></div></div>
    <div class="suncatcher" id="sunbtn" title="Поймать солнечный луч!">☀️</div>
    <div class="village" id="village"></div>
    <div class="ground"></div>
    <div class="bigDragon" id="bigdragon" title="Тыкни на дракона!">🦎</div>
    <div class="rainbowWing">🌈</div>
  </div>

  <div class="panel">
    <h2>Стройка и дела</h2>
    <button id="buildHut">🛖 Хижина (10 🥭)</button>
    <button id="hatch" class="alt">🥚 Вылупить дракончика (20 🥭 + 5 🐚)</button>
    <button id="vanish" class="sun">✨ Камуфляж-минутка (бесплатно)</button>
    <button id="fair" class="sun">🎪 Мини-ярмарка фруктов (30 🥭)</button>
    <button id="reset" class="danger">🔄 Новая долина</button>
    <div class="saveship" id="saveship">💾 Прогресс сохраняется автоматически в твоём браузере</div>
    <div class="daybar"><div class="marker" id="daymarker"></div></div>
  </div>

  <div class="panel">
    <h2>Дневник деревни</h2>
    <ul class="log" id="log"></ul>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const SAVE_KEY='rainwing-village-simulator-v1';
const DEFAULTS={fruit:5, shells:0, morale:50, pop:1, huts:0};
let S=Object.assign({}, DEFAULTS);
let hidden=false, dayT=0;

function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    document.getElementById('saveship').textContent='💾 Сохранено: '+new Date().toLocaleTimeString();
  }catch(e){ console.warn('save failed', e); }
}
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(raw){ const got=JSON.parse(raw);
      if(got && typeof got.fruit==='number'){ S=Object.assign({}, DEFAULTS, got); return true; }
    }
  }catch(e){ console.warn('load failed', e); }
  return false;
}

const $=id=>document.getElementById(id);
function toast(t){const el=$('toast'); el.textContent=t; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1600);}
function log(msg){const ul=$('log'), li=document.createElement('li'); li.textContent='• '+msg;
  ul.prepend(li); while(ul.children.length>30) ul.lastChild.remove();}
function render(){
  $('fruit').textContent=Math.floor(S.fruit);
  $('shells').textContent=Math.floor(S.shells);
  $('morale').textContent=Math.round(S.morale)+'%';
  $('pop').textContent=S.pop;
  const v=$('village'); v.innerHTML='';
  for(let i=0;i<S.huts;i++){const h=document.createElement('div'); h.className='hut'+(i%2?' hutsleep':''); v.appendChild(h);}
  $('hatch').disabled = S.fruit<20 || S.shells<5;
  $('buildHut').disabled = S.fruit<10;
  $('fair').disabled = S.fruit<30 || fairActive;
}
function addFruit(n){S.fruit+=n; if(S.fruit>999)S.fruit=999; render();}

$('sunbtn').addEventListener('click',()=>{addFruit(2); save(); toast('☀️ Солнечные ванны! +2 фруктов');});
$('bigdragon').addEventListener('click',()=>{
  if(hidden){hidden=false; document.querySelector('.bigDragon').style.opacity=1;
    toast('Дракон проявился!'); return;}
  S.shells+=1; render(); save(); toast('✨ +1 краска! Камуфляжная ловкость и тренировка.');
});
$('vanish').addEventListener('click',()=>{
  hidden=true; const d=document.querySelector('.bigDragon'); d.style.opacity=0.15;
  S.morale=Math.min(100,S.morale+8); render(); save(); toast('🐉 Kamuflyazh-minute! Настроение чуть подросло.');
  setTimeout(()=>{hidden=false; d.style.opacity=1; render();},60*1000);
});
$('buildHut').addEventListener('click',()=>{
  if(S.fruit<10) return;
  S.fruit-=10; S.huts++; render(); save(); log('🛖 Построена хижина №'+S.huts+'. Дракончики успокоились.');
  toast('Хижина построена!');
});
$('hatch').addEventListener('click',()=>{
  if(S.fruit<20||S.shells<5) return;
  S.fruit-=20; S.shells-=5; S.pop++;
  S.morale=Math.min(100,S.morale+5);
  const berries=['🍀','🌟','🥭','🌴']; log('🥚 из яйца ('+(berries[Math.floor(Math.random()*4)]||'')+'). Вылупился дракончик №'+S.pop+'!');
  render(); save(); toast('🐣 Новый дракончик!');
});
$('reset').addEventListener('click',()=>{
  if(!confirm('Начать новую долину? Весь прогресс исчезнет (как туман утром).')) return;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  S=Object.assign({}, DEFAULTS); render(); save();
  $('log').innerHTML=''; log('🌱 Новая долина! Солнце снова высоко.');
  toast('🌱 Долина начата заново');
});

// ===== Мини-ярмарка фруктов =====
let fairActive=false, fairScore=0, fairTime=0, fairTid=null, fairSpid=null, fairBest=+(localStorage.getItem('fairBest')||0);

$('fair').addEventListener('click',()=>{
  if(fairActive || S.fruit<30) return;
  S.fruit-=30; render(); save();
  startFair();
});

function startFair(){
  fairActive=true; fairScore=0; fairTime=20;
  const stage=$('stage');
  const ov=document.createElement('div');
  ov.id='fairOv';
  ov.style.cssText='position:absolute;inset:0;background:rgba(11,61,46,.82);z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Nunito,sans-serif;';
  ov.innerHTML='<div style="font-size:1.6rem;font-weight:700">🎪 Ярмарка фруктов!</div>'
    +'<div id="fairTimer" style="font-size:2.2rem;font-weight:700;color:var(--sun-gold)">20</div>'
    +'<div id="fairScore" style="font-size:1.1rem;margin:6px 0 12px">Поймано: 0 🥭</div>'
    +'<div id="fairArena" style="position:relative;width:100%;height:220px"></div>'
    +'<div style="font-size:.8rem;opacity:.8;margin-top:6px">Тыкай на падающие фрукты!</div>';
  stage.appendChild(ov);
  const arena=ov.querySelector('#fairArena');
  arena.addEventListener('click',e=>{
    if(e.target.classList.contains('fairFruit')){
      fairScore++;
      e.target.remove();
      ov.querySelector('#fairScore').textContent='Поймано: '+fairScore+' 🥭';
    }
  });
  fairSpid=setInterval(()=>{
    const f=document.createElement('div');
    f.className='fairFruit';
    f.textContent=['🥭','🍎','🍍','🍑','🥝'][Math.floor(Math.random()*5)];
    f.style.cssText='position:absolute;font-size:26px;cursor:pointer;left:'+(Math.random()*85+2)+'%;top:-30px;transition:top 2.2s linear;';
    arena.appendChild(f);
    requestAnimationFrame(()=>{ f.style.top='230px'; });
    setTimeout(()=>f.remove(),2400);
  },700);
  fairTid=setInterval(()=>{
    fairTime--;
    ov.querySelector('#fairTimer').textContent=fairTime;
    if(fairTime<=0) endFair();
  },1000);
}

function endFair(){
  clearInterval(fairTid); clearInterval(fairSpid);
  const ov=$('fairOv'); if(ov) ov.remove();
  fairActive=false;
  const earned=fairScore*2;
  S.fruit=Math.min(999,S.fruit+earned);
  S.morale=Math.min(100,S.morale+Math.min(10,fairScore));
  let rec='';
  if(fairScore>fairBest){ fairBest=fairScore; try{localStorage.setItem('fairBest',fairBest);}catch(e){} rec=' 🏆 Новый рекорд!'; }
  log('🎪 Ярмарка окончена: поймано '+fairScore+' фруктов, выручка +'+earned+' 🥭.'+rec);
  render(); save();
  toast('🎪 Выручка: +'+earned+' фруктов!'+rec);
}

function gatheringTick(){
  if(S.pop>0){
    addFruit(S.pop);
    if(Math.random()<0.3) log('🌴 Собираем нектар — дракончики вернулись с фр.');
  }
}
setInterval(gatheringTick,3000);
function tick(){
  dayT=(dayT+0.8)%100;
  $('daymarker').style.marginLeft=Math.round(dayT)+'%';
  if(dayT>85 && S.morale>10) S.morale-=1;
  render();
}
setInterval(tick,1000);
setInterval(save,5000);
window.addEventListener('beforeunload', save);

const loaded=load();
render();
log(loaded ? '🌅 Долина проснулась — прогресс найден в localStorage. Добро пожаловать домой!'
           : '🌱 Доброе утро! Долина цветёт, нектар, фрукты и сладкие фантазии ждут.');
</script>
</body>
</html>
